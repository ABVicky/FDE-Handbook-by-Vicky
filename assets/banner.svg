<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title>FDE Handbook by Vicky: become a Forward Deployed Engineer, from zero to field-ready</title>
  <defs>
    <clipPath id="frame"><rect width="1280" height="440" rx="28"/></clipPath>
    <radialGradient id="gRed" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#E53935" stop-opacity=".55"/><stop offset="1" stop-color="#E53935" stop-opacity="0"/></radialGradient>
    <radialGradient id="gGold" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F7AE2E" stop-opacity=".4"/><stop offset="1" stop-color="#F7AE2E" stop-opacity="0"/></radialGradient>
    <radialGradient id="gBlue" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2F7FE0" stop-opacity=".45"/><stop offset="1" stop-color="#2F7FE0" stop-opacity="0"/></radialGradient>
    <radialGradient id="gWine" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9E1915" stop-opacity=".6"/><stop offset="1" stop-color="#9E1915" stop-opacity="0"/></radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26191A"/><stop offset=".55" stop-color="#171416"/><stop offset="1" stop-color="#0E0F13"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6B5F"/><stop offset=".45" stop-color="#F7AE2E"/><stop offset="1" stop-color="#FFD98A"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E53935"/><stop offset="1" stop-color="#9E1915"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".09"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="dotMask"><rect width="1280" height="440" fill="url(#fade)"/></mask>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="url(#base)"/>
    <circle cx="1080" cy="40" r="360" fill="url(#gRed)"><animateTransform attributeName="transform" type="translate" values="0 0; -120 60; 0 0" dur="18s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="430" r="300" fill="url(#gGold)"><animateTransform attributeName="transform" type="translate" values="0 0; 80 -50; 0 0" dur="22s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="470" r="380" fill="url(#gWine)"><animateTransform attributeName="transform" type="translate" values="0 0; 140 -40; 0 0" dur="24s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="540" r="280" fill="url(#gBlue)"><animateTransform attributeName="transform" type="translate" values="0 0; -90 -70; 0 0" dur="28s" repeatCount="indefinite"/></circle>
    <rect width="1280" height="440" fill="url(#dots)" mask="url(#dotMask)"/>
    <rect x="-600" y="-100" width="420" height="640" fill="url(#shine)" transform="rotate(18)"><animate attributeName="x" values="-700;1500;1500" keyTimes="0;.5;1" dur="9s" repeatCount="indefinite"/></rect>

    <!-- eyebrow with icon -->
    <g transform="translate(72 64)">
      <rect width="44" height="44" rx="11" fill="url(#tile)"/>
      <path d="M10 15l7 7-7 7" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M30 33c-4.5-4.8-7-8.3-7-11.7a7 7 0 0 1 14 0c0 3.4-2.5 6.9-7 11.7z" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round"/>
      <circle cx="30" cy="21.3" r="2.2" fill="#F3B552"/>
      <g transform="translate(58 3)">
        <rect width="470" height="38" rx="19" fill="#F7AE2E" fill-opacity=".12" stroke="#F7AE2E" stroke-opacity=".45"/>
        <text x="20" y="25" fill="#F7AE2E" font-size="14" font-weight="700" letter-spacing="2.2">✦ FROM ZERO TO FIELD-READY · STEP BY STEP</text>
      </g>
    </g>

    <text x="70" y="196" fill="#FBF9F4" font-size="80" font-weight="800" letter-spacing="-2.5">FDE Handbook</text>
    <text x="70" y="282" font-size="80" font-weight="800" letter-spacing="-2.5" fill="url(#title)">by Vicky</text>
    <text x="72" y="332" fill="#E6E1DC" font-size="22">Learn to become a Forward Deployed Engineer, step by step.</text>

    <g font-size="15" font-weight="600" fill="#FBF9F4">
      <g transform="translate(72 362)"><rect width="140" height="36" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".14"/><text x="70" y="23" text-anchor="middle">12 modules</text></g>
      <g transform="translate(224 362)"><rect width="190" height="36" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".14"/><text x="95" y="23" text-anchor="middle">1 real client project</text></g>
      <g transform="translate(426 362)"><rect width="160" height="36" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".14"/><text x="80" y="23" text-anchor="middle">AI, RAG &amp; agents</text></g>
      <g transform="translate(598 362)"><rect width="150" height="36" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".14"/><text x="75" y="23" text-anchor="middle">Interview prep</text></g>
    </g>

    <!-- engagement terminal -->
    <g transform="translate(850 84)">
      <animateTransform attributeName="transform" type="translate" values="850 84; 850 72; 850 84" dur="7s" repeatCount="indefinite"/>
      <rect width="360" height="206" rx="16" fill="#111014" stroke="#E53935" stroke-opacity=".6"/>
      <circle cx="22" cy="22" r="5" fill="#FF6B5F"/><circle cx="40" cy="22" r="5" fill="#F7AE2E"/><circle cx="58" cy="22" r="5" fill="#3DD68C"/>
      <text x="340" y="26" fill="#8E8A90" font-size="12" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">engagement.sh</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
        <text x="22" y="66"><tspan fill="#FF6B5F">$ discover</tspan><tspan fill="#E4E0DD"> the real problem</tspan></text>
        <text x="22" y="94"><tspan fill="#F7AE2E">$ build</tspan><tspan fill="#E4E0DD">    app + data + AI</tspan></text>
        <text x="22" y="122"><tspan fill="#5AA2F5">$ deploy</tspan><tspan fill="#E4E0DD">   to the cloud</tspan></text>
        <text x="22" y="150"><tspan fill="#3DD68C">$ handover</tspan><tspan fill="#E4E0DD"> to the client</tspan></text>
        <rect x="22" y="166" width="9" height="18" fill="#E53935"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/></rect>
      </g>
    </g>
    <!-- result card -->
    <g transform="translate(990 306)">
      <animateTransform attributeName="transform" type="translate" values="990 306; 990 316; 990 306" dur="6s" repeatCount="indefinite"/>
      <rect width="230" height="84" rx="14" fill="#13201A" stroke="#3DD68C" stroke-opacity=".6"/>
      <circle cx="24" cy="26" r="9" fill="#3DD68C"/>
      <path d="M19.5 26l3 3 5.5-6" stroke="#0E1014" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="31" fill="#FBF9F4" font-size="14" font-weight="700">Client problem solved</text>
      <rect x="18" y="50" width="194" height="6" rx="3" fill="#fff" fill-opacity=".2"/>
      <rect x="18" y="64" width="0" height="6" rx="3" fill="#3DD68C"><animate attributeName="width" values="0;150;150" keyTimes="0;.6;1" dur="4s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="#F7AE2E">
      <path d="M1236 66l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></path>
      <path d="M820 330l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></path>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="439" rx="27.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
