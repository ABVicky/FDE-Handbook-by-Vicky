<text x="48" y="62" fill="#F7AE2E" font-size="13" font-weight="800" letter-spacing="2.2">HOW EVERY MODULE WORKS</text><text x="48" y="98" fill="#F5F1EE" font-size="28" font-weight="800" letter-spacing="-.5">The same four parts in every module, so you always know what comes next</text>
