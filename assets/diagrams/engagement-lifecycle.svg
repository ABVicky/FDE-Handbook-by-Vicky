<text x="626" y="296" fill="#B9B0AD" font-size="13.5" font-weight="500" text-anchor="start" >Is it good</text>
<text x="626" y="315" fill="#B9B0AD" font-size="13.5" font-weight="500" text-anchor="start" >enough to</text>
<text x="626" y="334" fill="#B9B0AD" font-size="13.5" font-weight="500" text-anchor="start" >trust?</text>
