<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The FDE engagement lifecycle</title>
  <desc id="d">Discover, define, design, prototype, validate, deploy, monitor, hand over, with loops back when results fall short or new needs appear.</desc>
