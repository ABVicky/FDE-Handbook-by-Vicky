<text x="48" y="62" fill="#F7AE2E" font-size="13" font-weight="800" letter-spacing="2.2">THE ENGAGEMENT LIFECYCLE</text><text x="48" y="98" fill="#F5F1EE" font-size="28" font-weight="800" letter-spacing="-.5">Eight stages of every FDE project, and the question each one answers</text>
