<text x="908" y="296" fill="#B9B0AD" font-size="13.5" font-weight="500" text-anchor="start" >Is it</text>
<text x="908" y="315" fill="#B9B0AD" font-size="13.5" font-weight="500" text-anchor="start" >delivering</text>
<text x="908" y="334" fill="#B9B0AD" font-size="13.5" font-weight="500" text-anchor="start" >value?</text>
