<text x="1049" y="296" fill="#B9B0AD" font-size="13.5" font-weight="500" text-anchor="start" >Can they own it</text>
<text x="1049" y="315" fill="#B9B0AD" font-size="13.5" font-weight="500" text-anchor="start" >without you?</text>
