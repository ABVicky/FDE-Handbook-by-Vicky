<text x="630" y="149" fill="#F5F1EE" font-size="16" font-weight="800" text-anchor="start" >C1  Understand the business</text>
<text x="630" y="170" fill="#B9B0AD" font-size="13.5" font-weight="500" text-anchor="start" >Map the workflow, find the bottleneck, measure success</text>
<rect x="560" y="200" width="592" height="68" rx="14" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/>
<rect x="576" y="214" width="40" height="40" rx="11" fill="#F7AE2E" fill-opacity=".16"/><g transform="translate(585 223) scale(0.9167)" fill="none" stroke="#F7AE2E" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></g>
<text x="630" y="231" fill="#F5F1EE" font-size="16" font-weight="800" text-anchor="start" >C2  Build software</text>
<text x="630" y="252" fill="#B9B0AD" font-size="13.5" font-weight="500" text-anchor="start" >Write, test and maintain a full-stack app</text>
<rect x="560" y="282" width="592" height="68" rx="14" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/>
<rect x="576" y="296" width="40" height="40" rx="11" fill="#B48CFF" fill-opacity=".16"/><g transform="translate(585 305) scale(0.9167)" fill="none" stroke="#B48CFF" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></g>
<text x="630" y="313" fill="#F5F1EE" font-size="16" font-weight="800" text-anchor="start" >C3  Apply AI and data</text>
<text x="630" y="334" fill="#B9B0AD" font-size="13.5" font-weight="500" text-anchor="start" >Know when AI helps; build RAG and agents; evaluate honestly</text>
<rect x="560" y="364" width="592" height="68" rx="14" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/>
