<text x="306" y="261.5" fill="#B9B0AD" font-size="10.5" font-weight="600" text-anchor="start" >2 Guided</text>
<text x="306" y="220.25" fill="#B9B0AD" font-size="10.5" font-weight="600" text-anchor="start" >3 Independent</text>
<text x="306" y="179.0" fill="#B9B0AD" font-size="10.5" font-weight="600" text-anchor="start" >4 Field-ready</text>
<rect x="130" y="520" width="14" height="4" rx="2" fill="#E53935"/><text x="152" y="525" fill="#B9B0AD" font-size="12.5" font-weight="400" text-anchor="start" >Target to call yourself field-ready: all at 3+, two at 4</text>
