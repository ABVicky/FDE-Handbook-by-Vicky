<text x="630" y="395" fill="#F5F1EE" font-size="16" font-weight="800" text-anchor="start" >C4  Deploy and integrate</text>
<text x="630" y="416" fill="#B9B0AD" font-size="13.5" font-weight="500" text-anchor="start" >Ship into a real environment, connect systems, secure it</text>
<rect x="560" y="446" width="592" height="68" rx="14" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/>
<rect x="576" y="460" width="40" height="40" rx="11" fill="#FF8A80" fill-opacity=".16"/><g transform="translate(585 469) scale(0.9167)" fill="none" stroke="#FF8A80" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></g>
<text x="630" y="477" fill="#F5F1EE" font-size="16" font-weight="800" text-anchor="start" >C5  Lead the engagement</text>
<text x="630" y="498" fill="#B9B0AD" font-size="13.5" font-weight="500" text-anchor="start" >Run discovery, set expectations, hand over, show impact</text>
