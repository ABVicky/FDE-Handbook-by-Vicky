<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What a Forward Deployed Engineer does</title>
  <desc id="d">An FDE combines engineering skills with people skills to build what a real client needs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#231819"/><stop offset=".55" stop-color="#161315"/><stop offset="1" stop-color="#0F1013"/></linearGradient>
    <radialGradient id="glowR" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#E53935" stop-opacity=".30"/><stop offset="1" stop-color="#E53935" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F7AE2E" stop-opacity=".18"/><stop offset="1" stop-color="#F7AE2E" stop-opacity="0"/></radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E53935"/><stop offset="1" stop-color="#9E1915"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B9B0AD"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E53935"/></marker>
    <clipPath id="clip"><rect width="1200" height="520" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="520" fill="url(#bg)"/>
    <circle cx="1120" cy="20" r="364" fill="url(#glowR)"/>
    <circle cx="60" cy="520" r="312" fill="url(#glowG)"/>
<text x="48" y="62" fill="#F7AE2E" font-size="13" font-weight="800" letter-spacing="2.2">WHAT AN FDE DOES</text><text x="48" y="98" fill="#F5F1EE" font-size="28" font-weight="800" letter-spacing="-.5">Two skill sets, one job: make technology work for a real client</text>
<circle cx="470" cy="300" r="170" fill="#5AA2F5" fill-opacity=".13" stroke="#5AA2F5" stroke-opacity=".6" stroke-width="2"/>
<circle cx="730" cy="300" r="170" fill="#F7AE2E" fill-opacity=".11" stroke="#F7AE2E" stroke-opacity=".6" stroke-width="2"/>
<g transform="translate(382 196) scale(1.0833)" fill="none" stroke="#5AA2F5" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></g><text x="418" y="216" fill="#F5F1EE" font-size="20" font-weight="800" text-anchor="start" >Engineering</text>
<text x="352" y="262" fill="#DCE8F8" font-size="15" font-weight="500" text-anchor="start" >•  Write and test code</text>
<text x="352" y="292" fill="#DCE8F8" font-size="15" font-weight="500" text-anchor="start" >•  Work with data and SQL</text>
<text x="352" y="322" fill="#DCE8F8" font-size="15" font-weight="500" text-anchor="start" >•  Deploy to the cloud</text>
<text x="352" y="352" fill="#DCE8F8" font-size="15" font-weight="500" text-anchor="start" >•  Build with AI (RAG, agents)</text>
<g transform="translate(742 196) scale(1.0833)" fill="none" stroke="#F7AE2E" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></g><text x="778" y="216" fill="#F5F1EE" font-size="20" font-weight="800" text-anchor="start" >People</text>
<text x="712" y="262" fill="#FBEBD0" font-size="15" font-weight="500" text-anchor="start" >•  Ask good questions</text>
<text x="712" y="292" fill="#FBEBD0" font-size="15" font-weight="500" text-anchor="start" >•  Find the real problem</text>
<text x="712" y="322" fill="#FBEBD0" font-size="15" font-weight="500" text-anchor="start" >•  Explain trade-offs</text>
<text x="712" y="352" fill="#FBEBD0" font-size="15" font-weight="500" text-anchor="start" >•  Earn trust, hand over</text>
<circle cx="600" cy="300" r="58" fill="url(#tile)" stroke="#fff" stroke-opacity=".25"/>
<text x="600" y="296" fill="#fff" font-size="26" font-weight="900" text-anchor="middle" >FDE</text>
<text x="600" y="318" fill="#FFE0DC" font-size="13" font-weight="600" text-anchor="middle" >you</text>
<rect x="48" y="150" width="250" height="300" rx="16" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)"/>
<text x="70" y="182" fill="#5AA2F5" font-size="11.5" font-weight="800" text-anchor="start" letter-spacing="1.4">A SOFTWARE ENGINEER</text>
<text x="70" y="214" fill="#F5F1EE" font-size="15" font-weight="500" text-anchor="start" >builds one product</text>
<text x="70" y="240" fill="#F5F1EE" font-size="15" font-weight="500" text-anchor="start" >for thousands of users</text>
<text x="70" y="266" fill="#F5F1EE" font-size="15" font-weight="500" text-anchor="start" >from a ticket backlog</text>
<text x="70" y="316" fill="#F7AE2E" font-size="11.5" font-weight="800" text-anchor="start" letter-spacing="1.4">A CONSULTANT</text>
<text x="70" y="348" fill="#F5F1EE" font-size="15" font-weight="500" text-anchor="start" >advises and presents</text>
<text x="70" y="374" fill="#F5F1EE" font-size="15" font-weight="500" text-anchor="start" >but rarely ships</text>
<text x="70" y="400" fill="#F5F1EE" font-size="15" font-weight="500" text-anchor="start" >the working system</text>
<rect x="902" y="150" width="250" height="300" rx="16" fill="rgba(229,57,53,.08)" stroke="#E53935"/>
<text x="924" y="182" fill="#FF8A80" font-size="11.5" font-weight="800" text-anchor="start" letter-spacing="1.4">AN FDE</text>
<text x="924" y="214" fill="#F5F1EE" font-size="15" font-weight="500" text-anchor="start" >sits with one client,</text>
<text x="924" y="240" fill="#F5F1EE" font-size="15" font-weight="500" text-anchor="start" >learns how work really</text>
<text x="924" y="266" fill="#F5F1EE" font-size="15" font-weight="500" text-anchor="start" >happens, then builds,</text>
<text x="924" y="292" fill="#F5F1EE" font-size="15" font-weight="500" text-anchor="start" >ships and hands over</text>
<text x="924" y="318" fill="#F5F1EE" font-size="15" font-weight="500" text-anchor="start" >the system that fixes it.</text>
<g transform="translate(924 360) scale(0.9167)" fill="none" stroke="#FF8A80" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g><text x="954" y="377" fill="#F5F1EE" font-size="14" font-weight="700" text-anchor="start" >Measured by results</text>
<text x="954" y="397" fill="#B9B0AD" font-size="13" font-weight="400" text-anchor="start" >not lines of code</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="519" rx="23.5" fill="none" stroke="rgba(255,255,255,.1)"/>
</svg>
