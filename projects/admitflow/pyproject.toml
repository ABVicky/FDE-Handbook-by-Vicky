[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "admitflow"
version = "0.9.0"
description = "AdmitFlow admissions system (FDE Handbook running project)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "pyjwt>=2.8"]
db = ["sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2"]
ml = ["scikit-learn>=1.5", "pandas>=2.0", "joblib>=1.3"]
llm = ["anthropic>=2.0; python_version >= '3.10'", "pydantic>=2.7"]
integrations = ["httpx>=0.27", "pyjwt[crypto]>=2.8", "mcp>=2.0; python_version >= '3.10'"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[project.scripts]
admitflow = "admitflow.cli:main"

[tool.setuptools]
packages = ["admitflow", "admitflow.api", "admitflow.integrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=admitflow --cov-report=term-missing --cov-fail-under=80"
