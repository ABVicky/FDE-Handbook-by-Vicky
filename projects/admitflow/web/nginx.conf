server {
    listen 8080;
    root /usr/share/nginx/html;

    # Security headers (Module 10 explains each)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Only our own scripts and styles; API calls only over HTTPS (or same origin). Tighten connect-src to the real API URL.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Fingerprinted assets can be cached for a long time; index.html must not be
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;   # single-page app: unknown paths serve the app
    }
}
