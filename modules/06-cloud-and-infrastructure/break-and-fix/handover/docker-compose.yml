services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admitflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: admitflow

  api:
    build: .
    command: ["uvicorn", "admitflow.api:create_app", "--factory", "--host", "127.0.0.1", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://admitflow:${POSTGRES_PASSWORD}@localhost:5432/admitflow
      ADMITFLOW_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db
