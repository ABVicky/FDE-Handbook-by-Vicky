name: 💡 Content Suggestion or Case Study
description: Suggest an enhancement, real-world case study, or additional exercise
title: "[Suggestion]: "
labels: ["enhancement", "discussion"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome practical suggestions that make this handbook more useful for aspiring Forward Deployed Engineers.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - "New Exercise or Break-and-Fix Scenario"
        - "Real-World FDE Case Study"
        - "Enterprise Integration / Tooling (MCP, OAuth, etc.)"
        - "Interview Preparation Question"
        - "AdmitFlow Project Feature"
        - "Platform UI/UX Feature"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal Description
      description: Describe the concept, why it matters for an FDE, and how it fits into the curriculum.
      placeholder: "What would you like to see added or improved?"
    validations:
      required: true
