# CI for the AdmitFlow reference project (Module 06).
# Runs on every pull request and on pushes to main.
name: AdmitFlow CI

on:
  pull_request:
    paths: ["projects/admitflow/**", ".github/workflows/admitflow-ci.yml"]
  push:
    branches: [main]
    paths: ["projects/admitflow/**", ".github/workflows/admitflow-ci.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/admitflow

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admitflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: admitflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admitflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://admitflow:ci-only-password@localhost:5432/admitflow_test
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,db,ml,llm,integrations,dev]"
      - name: Tests (JSON, SQLite and PostgreSQL backends)
        run: pytest
      - name: Tests in UTC too (time-zone bugs hide in one zone)
        run: pytest -o addopts="" -q tests/test_api.py
        env:
          TZ: UTC
      - name: Migrations apply cleanly to PostgreSQL and match the models
        env:
          DATABASE_URL: postgresql+psycopg://admitflow:ci-only-password@localhost:5432/admitflow_test
        run: |
          python -c "from admitflow.db import Base, SqlRepository; import os; Base.metadata.drop_all(SqlRepository(os.environ['DATABASE_URL']).engine)"
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/admitflow/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/admitflow/web/package-lock.json
      - run: npm ci
      - run: npm run build   # type-check (strict) + production build
      - run: npm test

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t admitflow-api:${{ github.sha }} .
      - name: Build dashboard image
        run: docker build -t admitflow-web:${{ github.sha }} web
      - name: Smoke-test the API image
        run: |
          docker run -d --name api -p 8000:8000 \
            -e ADMITFLOW_SECRET_KEY=ci-smoke-test-secret-key-0123456789abcdef \
            admitflow-api:${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
